packages:
  - apps/reference-server
  - packages/adapter-conformance
  - packages/adapter-generic-http
  - packages/adapter-sdk
  - packages/canonical-model
  - packages/cli
  - packages/compatibility-report
  - packages/contract-core
  - packages/extension-conformance
  - packages/extension-sdk
  - packages/migration-assessment
  - packages/portal-components
  - packages/reference-server-core
  - packages/signing
  - packages/support-evidence

allowBuilds:
  esbuild: true
  sharp: true

# Security overrides: pin transitive dependencies to the patched versions that
# clear the four Dependabot high-severity advisories, scoped to the exact
# vulnerable ranges so each override self-expires once a parent moves past it.
# Every patched version satisfies its parent's declared range, so no published
# package's compatibility changes.
#   - find-my-way <=9.6.0  -> 9.7.0   (GHSA-c96f-x56v-gq3h, HTTP/2 DDoS)
#   - fast-uri 3.x <=3.1.3 -> 3.1.4   (GHSA-v2hh-gcrm-f6hx, ReDoS)
#   - fast-uri 4.x <4.1.1  -> 4.1.1   (GHSA-v2hh-gcrm-f6hx, ReDoS)
#   - fast-xml-parser >=5.9.3 <5.10.1 -> 5.10.1 (GHSA-8r6m-32jq-jx6q, entity expansion)
# The final entry is a dev-only toolchain advisory (brace-expansion reaches the
# tree only through eslint/typescript-eslint) and never ships in any published
# package; it is pinned so the whole tree carries no known high/critical
# advisory, while the enforced gate remains production-scoped.
#   - brace-expansion 5.x <=5.0.7 -> 5.0.8 (GHSA-mh99-v99m-4gvg, ReDoS; dev only)
overrides:
  find-my-way@<9.7.0: 9.7.0
  fast-uri@>=3.0.0 <3.1.4: 3.1.4
  fast-uri@>=4.0.0 <4.1.1: 4.1.1
  fast-xml-parser@>=5.9.3 <5.10.1: 5.10.1
  brace-expansion@>=5.0.0 <5.0.8: 5.0.8
