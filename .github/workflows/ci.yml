name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Organization-baseline categories via the shared reusable building blocks
  # (see HookShip/.github RELEASE_POLICY.md). The documented pre-release ref is
  # @main until that repository publishes release refs. These provide the
  # standardized Build/Static-analysis/Type-safety/Tests and verified-secret-scan
  # categories; the toolkit-specific jobs below add everything beyond them.
  node-validate:
    name: Org Node validation
    uses: HookShip/.github/.github/workflows/reusable-node-validate.yml@main
    with:
      node-version: "22.23.1"
      pnpm-version: "11.13.0"

  secret-scan:
    name: Org verified secret scan
    uses: HookShip/.github/.github/workflows/reusable-secret-scan.yml@main

  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The comprehensive toolkit gate: formatting, lint, type-check, tests,
      # package boundaries, offline docs validation, secret hygiene + gitleaks,
      # release consistency, and build. It intentionally supersets the org
      # baseline and keeps gitleaks alongside the verified secret scan above.
      - run: pnpm check
      - name: Enforce isolated contract parser performance budgets
        env:
          CI_PERFORMANCE: "true"
        run: >-
          pnpm --filter @webhook-portal/contract-core exec vitest run
          test/security.test.ts --maxWorkers=1 --fileParallelism=false
          --testTimeout=15000 --hookTimeout=15000 -t "bounds
          repeated-reference|indexes many anchors|fails fast on adversarial
          AsyncAPI|preserves but does not evaluate user regexes|skips quadratic
          uniqueItems"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  package-smoke:
    name: Smoke and release dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke
      - run: pnpm pack:smoke
      - run: pnpm release:dry-run
      - name: Clean release artifacts
        if: always()
        run: pnpm release:clean

  dependency-audit:
    name: Production dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Deterministic, prod-scoped high/critical vulnerability gate. Fails closed
      # on any high/critical production advisory not covered by a reviewed,
      # time-bounded exception in scripts/vulnerability-allowlist.json.
      - run: pnpm check:audit

  reference-infra:
    name: Reference infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker info
      - run: pnpm check:compose
